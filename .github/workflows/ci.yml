name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: http://localhost:8787
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:5173
      WEB_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:5173
      API_PUBLIC_URL: http://localhost:8787
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
