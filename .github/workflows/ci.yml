name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: mimelie, POSTGRES_PASSWORD: mimelie, POSTGRES_DB: mimelie }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mimelie" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mimelie:mimelie@localhost:5432/mimelie
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      TOKEN_ENCRYPTION_KEY: ci-encryption-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @mimelie/database migrate:deploy
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
